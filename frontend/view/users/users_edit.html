<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh Sửa Người Dùng - Web Đọc Truyện</title>
    <link rel="stylesheet" href="../../public/css/user.css">
    <link rel="stylesheet" href="../../public/css/log.css">
</head>
<body>
    <a href="users.html" class="btn-home">← Quay lại danh sách</a>
    <h1 class="form-title">Chỉnh sửa người dùng</h1>

    <div id="api-message" class="api-message-center"></div>

    <form id="form-edit-user" class="user-form">
        <input type="hidden" id="user-id" name="id">

        <table>
            <tr>
                <td><label for="ten_dang_nhap">Tên đăng nhập:</label></td>
            </tr>
            <tr>
                <td>
                    <input type="text" id="ten_dang_nhap" class="input-disabled" disabled>
                    <small class="field-hint">Không thể chỉnh sửa tên đăng nhập</small>
                </td>
            </tr>

            <tr>
                <td><label for="email">Email: <span class="required-mark">*</span></label></td>
            </tr>
            <tr>
                <td>
                    <input type="email" id="email" name="email" required placeholder="example@email.com">
                </td>
            </tr>

            <tr>
                <td><label for="vai_tro">Vai trò: <span class="required-mark">*</span></label></td>
            </tr>
            <tr>
                <td>
                    <select id="vai_tro" name="vai_tro" required>
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </td>
            </tr>
        </table>

        <div class="form-actions">
            <button type="submit">Cập nhật</button>
        </div>
    </form>

    <script src="../../public/js/form-handler.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', async function() {
        const form = document.getElementById('form-edit-user');
        const msgBox = document.getElementById('api-message');

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id');

        if (!userId) {
            alert('Không tìm thấy ID người dùng!');
            window.location.href = 'users.html';
            return;
        }

        document.getElementById('user-id').value = userId;

        try {
            const res = await fetch(`http://localhost:8080/api/auth/hoso/get?id_nguoidung=${userId}`);
            const data = await res.json();

            if (data.success && data.data) {
                const u = data.data;
                document.getElementById('ten_dang_nhap').value = u.ten_dang_nhap || '';
                document.getElementById('email').value = u.email || '';
                document.getElementById('vai_tro').value = u.vai_tro || 'user';
            } else {
                msgBox.classList.add('msg-error');
                msgBox.textContent = 'Không tải được dữ liệu người dùng!';
            }
        } catch (err) {
            console.error(err);
            msgBox.classList.add('msg-error');
            msgBox.textContent = 'Lỗi kết nối máy chủ!';
        }

        bindAjaxForm(form, {
            messageBox: msgBox,
            url: 'http://localhost:8080/api/auth/update_user',
            method: 'POST',
            processingText: 'Đang cập nhật...',
            successText: 'Cập nhật thành công!',
            errorText: 'Cập nhật thất bại!',
            payload: function () {
                const fd = new FormData();
                fd.append('id_nguoidung', userId);
                fd.append('email', document.getElementById('email').value);
                fd.append('vai_tro', document.getElementById('vai_tro').value);
                return fd;
            }
        });
    });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Người Dùng - Web Đọc Truyện</title>
    <link rel="stylesheet" href="../../public/css/user.css">
    <link rel="stylesheet" href="../../public/css/log.css">
</head>
<body>
    <a href="users.html" class="btn-home">← Quay lại danh sách</a>

    <h1 class="form-title">Thêm người dùng mới</h1>

    <div id="api-message" class="api-message-center"></div>

    <form id="form-add-user" class="user-form">
        <table>
            <tr>
                <td><label for="ten_dang_nhap">Tên đăng nhập: <span class="required-mark">*</span></label></td>
            </tr>
            <tr>
                <td>
                    <input type="text" id="ten_dang_nhap" name="ten_dang_nhap" required placeholder="Nhập tên đăng nhập">
                </td>
            </tr>

            <tr>
                <td><label for="mat_khau">Mật khẩu: <span class="required-mark">*</span></label></td>
            </tr>
            <tr>
                <td>
                    <input type="password" id="mat_khau" name="mat_khau" required minlength="6" placeholder="Tối thiểu 6 ký tự">
                </td>
            </tr>

            <tr>
                <td><label for="email">Email: <span class="required-mark">*</span></label></td>
            </tr>
            <tr>
                <td>
                    <input type="email" id="email" name="email" required placeholder="example@email.com">
                </td>
            </tr>

            <tr>
                <td><label for="vai_tro">Vai trò: <span class="required-mark">*</span></label></td>
            </tr>
            <tr>
                <td>
                    <select id="vai_tro" name="vai_tro" required>
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </td>
            </tr>
        </table>

        <div class="form-actions">
            <button type="submit">Thêm mới</button>
        </div>
    </form>

    <script src="../../public/js/form-handler.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('form-add-user');
        const msgBox = document.getElementById('api-message');

        bindAjaxForm(form, {
            messageBox: msgBox,
            url: 'http://localhost:8080/api/auth/dangky',
            method: 'POST',
            useJson: true,
            processingText: 'Đang xử lý...',
            successText: 'Thêm người dùng thành công!',
            errorText: 'Thêm thất bại!',
            payload: function () {
                return JSON.stringify({
                    ten_dang_nhap: form.ten_dang_nhap.value.trim(),
                    mat_khau: form.mat_khau.value.trim(),
                    email: form.email.value.trim(),
                    vai_tro: form.vai_tro.value
                });
            },
            onSuccess: function (data) {
                if (data && data.success) {
                    form.reset();
                    setTimeout(() => { window.location.href = 'users.html'; }, 1000);
                }
            }
        });
    });
    </script>
</body>
</html>

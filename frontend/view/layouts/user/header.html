<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Đọc Truyện</title>
    <link rel="stylesheet" href="../../../public/css/theloai_user.css">
    <link rel="stylesheet" href="../../../public/css/home.css">
    <link rel="stylesheet" href="../../../public/css/log.css">
    <link rel="stylesheet" href="../../../public/fonts/fontawesome-free-7.2.0-web/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <h1><a href="/web_doc_truyen/frontend/public/index.html">DocTruyen</a></h1>
                <nav class="nav-left">
                    <div class="theloai-dropdown">
                        <a href="javascript:void(0)">Thể Loại</a>
                        <div class="theloai-menu">
                            <div class="theloai-grid" id="theloai-grid">
                                <div class="theloai-empty">Đang tải thể loại...</div>
                            </div>
                        </div>
                    </div>
                    <a href="/web_doc_truyen/frontend/view/theo_doi_truyen/theo_doi_truyen.html" class="quick-nav-link" id="follow-link">Theo Dõi</a>
                    <a href="/web_doc_truyen/frontend/view/luutrang/lich_su_doc.html" class="quick-nav-link">Lịch Sử</a>
                </nav>
                <form class="header-search" id="search-form">
                    <div class="search-input-wrap">
                        <i class="fa-solid fa-magnifying-glass search-icon" aria-hidden="true"></i>
                        <input type="text" class="search-input-header" name="keyword" id="header-keyword" value="" placeholder="Tìm kiếm truyện...">
                    </div>
                    <button type="submit" class="search-btn-header">Tìm kiếm</button>
                </form>
                <nav class="nav-right" id="nav-right">
                    <a href="/web_doc_truyen/frontend/view/log/login.html" class="login-state-btn">Đăng Nhập</a>
                </nav>
            </div>
        </div>
    </header>

    <script>
    (function () {
        var categoryGrid = document.getElementById('theloai-grid');
        var navRight = document.getElementById('nav-right');
        var keywordInput = document.getElementById('header-keyword');

        function renderCategories(categories, message) {
            categoryGrid.innerHTML = '';
            if (!Array.isArray(categories) || categories.length === 0) {
                var emptyDiv = document.createElement('div');
                emptyDiv.className = 'theloai-empty';
                emptyDiv.textContent = message || 'Chưa có thể loại';
                categoryGrid.appendChild(emptyDiv);
                return;
            }
            categories.forEach(function (category) {
                var link = document.createElement('a');
                link.className = 'theloai-item';
                link.href = '/web_doc_truyen/frontend/view/theloai/chitiettheloai.html?id=' + encodeURIComponent(category.id);
                link.textContent = category.ten_theloai || '';
                categoryGrid.appendChild(link);
            });
        }

        function renderUser(user) {
            navRight.innerHTML = '';
            if (user && user.isLoggedIn) {
                var avatarSrc = user.avatar
                    ? 'http://localhost:8080/uploads/avatar/' + user.avatar.split('/').pop()
                    : 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.displayName) + '&background=e27212&color=fff';

                var dropdownHtml = `
                    <div class="user-dropdown">
                        <div class="dropdown-toggle has-avatar">
                            <img src="${avatarSrc}" alt="Avatar" class="user-avatar">
                            <span class="user-name">${user.displayName || 'Tài khoản'}</span>
                        </div>
                        <div class="dropdown-menu">
                            <a href="/web_doc_truyen/frontend/view/hoso_user/hoso_view.html" class="dropdown-item"><i class="fa-regular fa-user"></i> Hồ sơ cá nhân</a>
                            <a href="/web_doc_truyen/frontend/view/theo_doi_truyen/theo_doi_truyen.html" class="dropdown-item"><i class="fa-regular fa-heart"></i> Truyện theo dõi</a>
                            <a href="/web_doc_truyen/frontend/view/luutrang/lich_su_doc.html" class="dropdown-item"><i class="fa-solid fa-clock-rotate-left"></i> Lịch sử đọc</a>
                            ${(user.vaiTro === 'admin' || user.vaiTro === 'Admin') ? '<a href="/web_doc_truyen/frontend/view/admin/dashboard.html" class="dropdown-item dropdown-item-admin"><i class="fa-solid fa-gear"></i> Trang quản trị</a>' : ''}
                            <a href="#" class="dropdown-item" id="btn-logout"><i class="fa-solid fa-arrow-right-from-bracket"></i> Đăng xuất</a>
                        </div>
                    </div>
                `;
                navRight.innerHTML = dropdownHtml;

                document.getElementById('btn-logout').addEventListener('click', function(e) {
                    e.preventDefault();
                    localStorage.removeItem('user');
                    localStorage.removeItem('isLoggedIn');
                    window.location.href = '/web_doc_truyen/frontend/view/log/login.html';
                });
                return;
            }

            var loginLink = document.createElement('a');
            loginLink.href = '/web_doc_truyen/frontend/view/log/login.html';
            loginLink.className = 'login-state-btn';
            loginLink.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập';
            navRight.appendChild(loginLink);
        }

        function loadHeaderData() {
            var userData = null;
            try {
                userData = JSON.parse(localStorage.getItem('user'));
            } catch (error) {
                console.warn('Lỗi lấy user từ localStorage:', error);
                userData = null;
            }

            var userId = null;
            if (userData) {
                userId = userData.id || userData.id_nguoidung || userData.iduser;
            }
            var userIdQuery = userId ? ('?id_nguoidung=' + userId) : '';

            fetch('http://localhost:8080/api/auth/header/init' + userIdQuery)
                .then(function (response) {
                    if (!response.ok) throw new Error('Lỗi load header');
                    return response.json();
                })
                .then(function (data) {
                    renderCategories(data.danhSachTheLoai, "Chưa có thể loại");
                    renderUser(data.user || {});
                })
                .catch(function (error) {
                    console.error(error);
                    renderCategories([], 'Không tải được thể loại');
                    renderUser({ isLoggedIn: false });
                });
        }

        loadHeaderData();
    })();

    var searchForm = document.getElementById('search-form');
    if (searchForm) {
        searchForm.addEventListener('submit', function(e) {
            e.preventDefault();
            var keyword = document.getElementById('header-keyword').value.trim();
            if (keyword) {
                window.location.href = '/web_doc_truyen/frontend/view/truyen/search.html?keyword=' + encodeURIComponent(keyword);
            }
        });
    }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - Web Đọc Truyện</title>
    <link rel="stylesheet" href="../../public/css/log.css">
    <link rel="stylesheet" href="../../public/fonts/fontawesome-free-7.2.0-web/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-wrapper">
            <h1 class="form-title">Đăng ký</h1>
            <div id="api-message" class="login-message"></div>

            <form id="register-form">
                <table>
                    <tr>
                        <td>
                            <label for="ten_dang_nhap">
                                Tên đăng nhập <span class="required-mark">*</span>
                            </label>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <input type="text" id="ten_dang_nhap" name="ten_dang_nhap" required placeholder="Nhập tên đăng nhập">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="mat_khau">
                                Mật khẩu <span class="required-mark">*</span>
                            </label>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <input type="password" id="mat_khau" name="mat_khau" required minlength="6" placeholder="Tối thiểu 6 ký tự">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="email">
                                Email <span class="required-mark">*</span>
                            </label>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <input type="email" id="email" name="email" required placeholder="example@email.com">
                        </td>
                    </tr>
                </table>
                <div class="form-actions">
                    <button type="submit" id="signup">Đăng ký</button>
                </div>

                <p class="form-footer-link">
                    Đã có tài khoản?
                    <a href="login.html">Đăng nhập ngay</a>
                </p>
                <p class="form-footer-link back-link">
                    <a href="../../public/index.html">← Quay lại trang chủ</a>
                </p>
            </form>
        </div>
    </div>

    <script src="../../public/js/form-handler.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('register-form');
        const msgBox = document.getElementById('api-message');
        const btnSignup = document.getElementById('signup');

        bindAjaxForm(form, {
            messageBox: msgBox,
            submitButton: btnSignup,
            url: 'http://localhost:8080/api/auth/dangky',
            method: 'POST',
            useJson: true,
            processingText: 'Đang xử lý...',
            successText: 'Đăng ký thành công!',
            errorText: 'Đăng ký thất bại!',
            payload: function () {
                return JSON.stringify({
                    ten_dang_nhap: document.getElementById('ten_dang_nhap').value.trim(),
                    mat_khau: document.getElementById('mat_khau').value.trim(),
                    email: document.getElementById('email').value.trim()
                });
            },
            onSuccess: function(data) {
                if (data && data.success) {
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1000);
                }
            },
            onError: function () {
                msgBox.style.color = '';
                msgBox.classList.add('msg-error');
                msgBox.textContent = 'Lỗi kết nối Server Spring Boot.';
            }
        });
    });
    </script>
</body>
</html>

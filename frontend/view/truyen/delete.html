<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xóa Truyện</title>
    <link rel="stylesheet" href="../../public/css/log.css">
    <link rel="stylesheet" href="../../public/css/truyen.css">
</head>
<body>
    <script src="../../public/js/admin-guard.js"></script>

    <a href="index.html" class="btn-home">← Quay lại</a>
    <h1 class="form-title">Xóa Truyện</h1>

    <div class="delete-box user-form">
        <div class="info-row">
            <label for="del-id"><strong>Nhập ID truyện:</strong></label>
            <input id="del-id" type="number" class="delete-id-input">
            <button id="btn-fetch" type="button" class="delete-fetch-btn btn-load">Tải</button>
        </div>

        <div id="truyen-info" class="delete-info-box">
            <p><strong>ID:</strong> <span id="info-id"></span></p>
            <p><strong>Tên truyện:</strong> <span id="info-ten"></span></p>
            <p><strong>Tác giả:</strong> <span id="info-tacgia"></span></p>
            <p><strong>Trạng thái:</strong> <span id="info-trangthai"></span></p>
            <p><img id="info-cover" src="" alt="cover"></p>
            <div class="delete-actions">
                <button id="btn-delete" class="btn-delete-danger">Xóa truyện</button>
                <span id="del-status" class="delete-status"></span>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function(){
        const fetchBtn = document.getElementById('btn-fetch');
        const delIdInput = document.getElementById('del-id');
        const infoBox = document.getElementById('truyen-info');
        const infoId = document.getElementById('info-id');
        const infoTen = document.getElementById('info-ten');
        const infoTacGia = document.getElementById('info-tacgia');
        const infoTrangThai = document.getElementById('info-trangthai');
        const infoCover = document.getElementById('info-cover');
        const deleteBtn = document.getElementById('btn-delete');
        const statusSpan = document.getElementById('del-status');

        async function fetchTruyen(id){
            try{
                const res = await fetch(`http://localhost:8080/api/truyen/get?id=${id}`);
                const json = await res.json();
                if(json && json.success && json.truyen){
                    const t = json.truyen;
                    infoId.textContent = t.id || id;
                    infoTen.textContent = t.ten_truyen || '';
                    infoTacGia.textContent = t.ten_tacgia || t.but_danh || '';
                    infoTrangThai.textContent = t.trang_thai || '';

                    if(t.anh_bia){
                        infoCover.src = 'http://localhost:8080/uploads/anhbia/' + t.anh_bia.split('/').pop();
                        infoCover.style.display = 'block';
                    } else {
                        infoCover.style.display = 'none';
                    }
                    infoBox.style.display = 'block';
                    statusSpan.textContent = '';
                } else {
                    alert(json.message || 'Không tìm thấy truyện');
                    infoBox.style.display = 'none';
                }
            } catch(err){
                console.error(err);
                alert('Lỗi khi tải truyện');
            }
        }

        fetchBtn.addEventListener('click', function(){
            const id = delIdInput.value.trim();
            if(!id) return alert('Nhập ID');
            fetchTruyen(id);
        });

        deleteBtn.addEventListener('click', async function(){
            const id = infoId.textContent || delIdInput.value.trim();
            if(!id) return alert('Chưa có ID');
            if(!confirm('Xác nhận xóa truyện ID=' + id + '?')) return;

            statusSpan.textContent = 'Đang xóa...';
            statusSpan.className = 'delete-status msg-info';

            try{
                const fd = new FormData();
                fd.append('id', id);
                fd.append('id_nguoidung', window.CURRENT_ADMIN_ID);

                const res = await fetch('http://localhost:8080/api/truyen/delete', {
                    method: 'POST',
                    body: fd
                });
                const json = await res.json();

                if(res.ok && json.success){
                    statusSpan.className = 'delete-status msg-success';
                    statusSpan.textContent = json.message || 'Đã xóa thành công!';
                    infoBox.style.display = 'none';
                    delIdInput.value = '';
                } else {
                    statusSpan.className = 'delete-status msg-error';
                    statusSpan.textContent = json.message || 'Xóa thất bại!';
                }
            } catch(err){
                console.error(err);
                statusSpan.className = 'delete-status msg-error';
                statusSpan.textContent = 'Lỗi kết nối server!';
            }
        });
    });
    </script>
</body>
</html>

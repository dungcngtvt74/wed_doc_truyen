<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xóa Thể Loại</title>
    <link rel="stylesheet" href="/web_doc_truyen/frontend/public/css/theloaiandtrang.css">
    <link rel="stylesheet" href="/web_doc_truyen/frontend/public/css/theloai.css">
</head>
<body>
    <script src="/web_doc_truyen/frontend/public/js/admin-guard.js"></script>

<a href="/web_doc_truyen/frontend/view/theloai" class="btn-home">← Quay lại</a>

<h1 class="form-title">Xóa Thể Loại</h1>

<div id="api-message"></div>

<div class="user-form">
    <table>
        <tr>
            <td>Nhập ID: <span class="required">*</span></td>
            <td class="id-input-cell">
                <input type="number" id="tl-id" placeholder="VD: 1">
                <button type="button" id="btn-load" class="btn-load">Tải</button>
            </td>
        </tr>
    </table>

    <div id="tl-info">
        <div class="tl-info-box">
            <table>
                <tr>
                    <td>ID:</td>
                    <td><span id="info-id" class="info-strong"></span></td>
                </tr>
                <tr>
                    <td>Tên thể loại:</td>
                    <td><span id="info-ten" class="info-strong"></span></td>
                </tr>
            </table>
        </div>

        <div class="form-actions">
            <button type="button" id="btn-delete" class="btn-danger">Xóa thể loại</button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const btnLoad = document.getElementById('btn-load');
    const idInput = document.getElementById('tl-id');
    const infoBox = document.getElementById('tl-info');
    const infoId = document.getElementById('info-id');
    const infoTen = document.getElementById('info-ten');
    const btnDelete = document.getElementById('btn-delete');
    const msg = document.getElementById('api-message');

    async function loadTheLoai(id) {
        if (!id) return alert('Nhập ID');
        try {
            const res = await fetch(`http://localhost:8080/api/theloai/get?id=${id}`);
            const data = await res.json();
            if (data.success) {
                infoId.textContent = data.data.id;
                infoTen.textContent = data.data.ten_theloai;
                infoBox.style.display = 'block';
                msg.textContent = '';
            } else {
                alert(data.message);
            }
        } catch (err) {
            alert('Lỗi: ' + err.message);
        }
    }

    btnLoad.addEventListener('click', () => loadTheLoai(idInput.value.trim()));

    const preId = new URLSearchParams(window.location.search).get('id');
    if (preId) {
        idInput.value = preId;
        loadTheLoai(preId);
    }

    btnDelete.addEventListener('click', async () => {
        const id = infoId.textContent;
        if (!confirm('Xác nhận xóa thể loại ID=' + id + '?')) return;
        btnDelete.disabled = true;
        try {
            const fd = new FormData();
            fd.append('id', id);
            fd.append('id_nguoidung', window.CURRENT_ADMIN_ID);
            const res = await fetch('http://localhost:8080/api/theloai/delete', {
                method: 'POST', body: fd
            });
            const data = await res.json();
            if (data.success) {
                msg.className = 'msg-success';
                msg.textContent = data.message || 'Đã xóa thành công';
                infoBox.style.display = 'none';
            } else {
                msg.className = 'msg-error';
                msg.textContent = data.message || 'Xóa thất bại';
            }
        } catch (err) {
            msg.className = 'msg-error';
            msg.textContent = 'Lỗi: ' + err.message;
        } finally {
            btnDelete.disabled = false;
        }
    });
});
</script>

</body>
</html>

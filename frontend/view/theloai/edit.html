<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sửa Thể Loại</title>
    <link rel="stylesheet" href="/web_doc_truyen/frontend/public/css/theloaiandtrang.css">
    <link rel="stylesheet" href="/web_doc_truyen/frontend/public/css/theloai.css">
</head>
<body>
    <script src="/web_doc_truyen/frontend/public/js/admin-guard.js"></script>

<a href="/web_doc_truyen/frontend/view/theloai  " class="btn-home">← Quay lại</a>

<h1 class="form-title">Sửa Thể Loại</h1>

<div id="api-message"></div>

<div class="user-form">
    <form id="form-edit">
        <input type="hidden" name="id" id="id">
        <table>
            <tr>
                <td>Nhập ID: <span class="required">*</span></td>
                <td class="id-input-cell">
                    <input type="number" id="tl-id" placeholder="VD: 1">
                    <button type="button" id="btn-load" class="btn-load">Tải</button>
                </td>
            </tr>
            <tr>
                <td>Tên thể loại: <span class="required">*</span></td>
                <td>
                    <input type="text" name="ten_theloai" id="ten" placeholder="VD: Hành động">
                </td>
            </tr>
        </table>

        <div class="form-actions">
            <button type="submit">Cập nhật</button>
        </div>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const btnLoad = document.getElementById('btn-load');
    const idInput = document.getElementById('tl-id');
    const idField = document.getElementById('id');
    const tenField = document.getElementById('ten');
    const msg = document.getElementById('api-message');

    async function loadTheLoai(id) {
        if (!id) return alert('Nhập ID');
        try {
            const res = await fetch(`http://localhost:8080/api/theloai/get?id=${id}`);
            const data = await res.json();
            if (data.success) {
                idField.value = data.data.id;
                tenField.value = data.data.ten_theloai;
                idInput.value = data.data.id;
                msg.className = 'msg-success';
                msg.textContent = 'Đã tải thể loại ID=' + id;
            } else {
                alert(data.message);
            }
        } catch (err) {
            alert('Lỗi: ' + err.message);
        }
    }

    btnLoad.addEventListener('click', () => loadTheLoai(idInput.value.trim()));

    const preId = new URLSearchParams(window.location.search).get('id');
    if (preId) loadTheLoai(preId);

    document.getElementById('form-edit').addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.textContent = '';
        const btn = e.target.querySelector('button[type="submit"]');
        btn.disabled = true;
        try {
            const fd = new FormData(e.target);
            fd.append('id_nguoidung', window.CURRENT_ADMIN_ID);

            const res = await fetch('http://localhost:8080/api/theloai/edit', {
                method: 'POST',
                body: fd
            });
            const data = await res.json();
            if (data.success) {
                msg.className = 'msg-success';
                msg.textContent = data.message || 'Cập nhật thành công';
            } else {
                msg.className = 'msg-error';
                msg.textContent = data.message || 'Cập nhật thất bại';
            }
        } catch (err) {
            msg.className = 'msg-error';
            msg.textContent = 'Lỗi: ' + err.message;
        } finally {
            btn.disabled = false;
        }
    });
});
</script>

</body>
</html>

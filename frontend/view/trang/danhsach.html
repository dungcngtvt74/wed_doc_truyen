<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Trang</title>
    <link rel="stylesheet" href="../../public/css/home.css">
    <link rel="stylesheet" href="../../public/css/theloai_user.css">
    <link rel="stylesheet" href="../../public/css/log.css">
    <link rel="stylesheet" href="../../public/fonts/fontawesome-free-7.2.0-web/css/all.min.css">
    <link rel="stylesheet" href="../../public/css/user.css">
    <link rel="stylesheet" href="../../public/css/chitiettrang.css">
</head>
<body>
    <div id="header-container"></div>

    <div class="container" id="main-content">
        <div class="story-status">Đang tải...</div>
    </div>

   <script>
    async function loadHeader() {
        try {
            const res = await fetch('/web_doc_truyen/frontend/view/layouts/user/header.html', { credentials: 'same-origin' });
            if (!res.ok) return;
            const html = await res.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const header = doc.querySelector('header');
            const scripts = doc.querySelectorAll('script');
            if (header) document.getElementById('header-container').innerHTML = header.outerHTML;
            scripts.forEach(s => {
                const el = document.createElement('script');
                if (s.src) el.src = s.src; else el.textContent = s.textContent;
                document.body.appendChild(el);
            });
        } catch (e) { console.error('Lỗi tải header:', e); }
    }

    function escapeHtml(v) {
        return String(v ?? '')
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function formatDate(dateStr) {
        if (!dateStr) return '';
        const d = new Date(dateStr);
        if (isNaN(d)) return dateStr;
        return d.toLocaleDateString('vi-VN');
    }

    function getCurrentAdminId() {
        try {
            const raw = localStorage.getItem('user');
            if (!raw) return null;
            const user = JSON.parse(raw);
            const vaiTro = user && (user.vaiTro || user.vai_tro);
            if (String(vaiTro).toLowerCase() !== 'admin') return null;
            return user.id || user.id_nguoidung || user.iduser || null;
        } catch (e) {
            return null;
        }
    }

    async function deleteTrang(id, cardEl) {
        if (!confirm('Xác nhận xóa trang này? Hành động không thể hoàn tác.')) return;
        const adminId = getCurrentAdminId();
        try {
            const fd = new FormData();
            fd.append('id', id);
            fd.append('id_nguoidung', adminId);
            const res = await fetch('http://localhost:8080/api/trang/delete', {
                method: 'POST',
                body: fd
            });
            const data = await res.json();
            if (data.success) {
                cardEl.remove();
            } else {
                alert(data.message || 'Xóa thất bại');
            }
        } catch (err) {
            alert('Lỗi kết nối server');
        }
    }

    function render(chuong, danhSachTrang) {
        document.title = `Danh Sách Trang - Chương ${chuong.so_chuong}`;

        const adminId = getCurrentAdminId();

        let trangHtml = '';
        if (Array.isArray(danhSachTrang) && danhSachTrang.length > 0) {
            trangHtml = `
                <div class="trang-grid">
                    ${danhSachTrang.map(trang => `
                        <div class="trang-card" data-trang-id="${escapeHtml(String(trang.id))}">
                            <a href="/web_doc_truyen/frontend/view/trang/chitiettrang.html?id=${escapeHtml(String(trang.id))}">
                                <div class="page-num-label">Trang</div>
                                <div class="page-num-value">${escapeHtml(String(trang.so_trang))}</div>
                            </a>
                            ${adminId ? `
                            <button type="button" class="btn-delete-trang" data-id="${escapeHtml(String(trang.id))}" title="Xóa trang này">
                                <i class="fa-solid fa-trash"></i>
                            </button>` : ''}
                        </div>
                    `).join('')}
                </div>`;
        } else {
            trangHtml = `<div class="empty-state"><p>Chưa có trang nào được đăng</p></div>`;
        }

        document.getElementById('main-content').innerHTML = `
            <div class="back-button-wrapper">
                <a href="/web_doc_truyen/frontend/view/truyen/chitiet.html?id=${escapeHtml(String(chuong.id_truyen))}" class="btn-back">
                    ← Quay lại
                </a>
                ${adminId ? `
                <a href="/web_doc_truyen/frontend/view/trang/add.html?id_chuong=${escapeHtml(String(chuong.id))}" class="btn-add-trang">
                    <i class="fa-solid fa-plus"></i> Thêm trang
                </a>` : ''}
            </div>
            <div class="page-header">
                <h1 class="page-title">
                    Chương ${escapeHtml(String(chuong.so_chuong))}:
                    ${escapeHtml(chuong.tieu_de || '')}
                </h1>
                <p class="page-number">${formatDate(chuong.ngay_dang)}</p>
            </div>
            <h2 class="section-title">Chọn Trang Để Đọc</h2>
            ${trangHtml}
        `;

        document.querySelectorAll('.btn-delete-trang').forEach(btn => {
            btn.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                const id = this.getAttribute('data-id');
                const card = this.closest('.trang-card');
                deleteTrang(id, card);
            });
        });
    }

    async function loadDanhSach() {
        const params = new URLSearchParams(window.location.search);
        const idChuong = parseInt(params.get('id_chuong') || '0');

        if (idChuong <= 0) {
            window.location.href = '/web_doc_truyen/frontend/view/index.html';
            return;
        }

        try {
            const resTrang = await fetch(`http://localhost:8080/api/trang/get_danhsach?id_chuong=${idChuong}`);
            const dataTrang = await resTrang.json();

            if (!dataTrang.success) {
                document.getElementById('main-content').innerHTML =
                    `<div class="story-status"><h3>Không tìm thấy chương</h3></div>`;
                return;
            }

            const danhSachTrang = dataTrang.trangs || dataTrang.data || dataTrang.body?.trangs || [];
            const chuong = dataTrang.chuong || dataTrang.body?.chuong || null;

            if (!chuong) {
                document.getElementById('main-content').innerHTML =
                    `<div class="story-status"><h3>Không tìm thấy thông tin chương</h3></div>`;
                return;
            }

            render(chuong, danhSachTrang);
        } catch (e) {
            console.error('Lỗi tải danh sách trang:', e);
            document.getElementById('main-content').innerHTML =
                `<div class="story-status"><h3>Lỗi tải dữ liệu, vui lòng thử lại</h3></div>`;
        }
    }

    loadHeader();
    loadDanhSach();
</script>
</body>
</html>
